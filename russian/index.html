<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Russian</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Russian">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#faf8f4;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--bd:#e4e0d8;--ac:#b3261e;--acs:#fbe9e7;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--fg:#f1efe9;--mut:#a09d94;--card:#1f1f1c;--bd:#33332e;--ac:#ef6f63;--acs:#3a1f1c}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.3 system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 12px)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px}
h1{font-size:22px;margin:0}
#play{display:flex;align-items:center;gap:6px;font:600 16px system-ui,-apple-system,sans-serif;color:#fff;background:var(--ac);border:0;border-radius:99px;padding:9px 16px 9px 13px}
#play svg{width:16px;height:16px;fill:currentColor}
ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
li button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
li.on button{border-color:var(--ac);background:var(--acs)}
.t{flex:1;min-width:0}
.t b{display:block;font-size:16px}
.t span{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.n{flex:none;min-width:40px;text-align:center;font:600 13px ui-monospace,SFMono-Regular,monospace;color:var(--mut);border:1px solid var(--bd);border-radius:99px;padding:3px 6px}
li.on .n{color:#fff;background:var(--ac);border-color:var(--ac)}
li.h button{display:flex;align-items:center;gap:6px;width:auto;border:0;background:none;padding:10px 2px 2px;font:700 12px system-ui,-apple-system,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ac)}
li.h button svg{width:10px;height:10px;fill:currentColor}
li.h:first-child button{padding-top:0}
#note{display:none;font-size:13px;color:var(--ac);margin:10px 2px 0}
</style></head><body><main>
<header><h1>Russian</h1><button id="play" type="button"></button></header>
<ol id="list"></ol>
<p id="note" role="status"></p>
</main>
<script>
// Blocks of [Russian (spoken), transliteration, English, repetitions]. One beep after each expression, two between blocks.
const BLOCKS=[["Greetings", [["Доброе утро.", "Dobroe utro.", "Good morning.", 10], ["Добрый день.", "Dobriy den'.", "Good afternoon.", 10], ["Добрый вечер.", "Dobriy vecher.", "Good evening.", 10], ["Привет, как дела?", "Privet, kak dela?", "Hi, how are you?", 2], ["Хорошо, а у тебя?", "Khorosho, a u tebya?", "Good, and you?", 2], ["Нормально.", "Normalno.", "Okay / Regular.", 2]]], ["Introductions", [["Здравствуйте. Приятно познакомиться.", "Zdravstvuyte. Priyatno poznakomitsya.", "Hello. Nice to meet you.", 2], ["Мне тоже приятно познакомиться.", "Mne tozhe priyatno poznakomitsya.", "Nice to meet you too.", 2], ["Меня зовут Джафар.", "Menya zovut Jaafar", "My name is Jaafar", 2], ["Вы откуда?", "Vy otkuda?", "Where are you from?", 10], ["Я из Марокко.", "Ya iz Marokko.", "I'm from Morocco.", 10]]], ["Getting by", [["Извините, вы говорите по-английски?", "Izvinite, Vy govorite po-angliyski?", "Excuse me, Do you speak English?", 10], ["Я немного говорю по-русски.", "Ya nemnogo govoryu po-russki.", "I speak a little Russian.", 10], ["Простите.", "Prostite.", "Forgive me. (formal)", 10], ["Прошу прощения.", "Proshu proshcheniya.", "I ask for forgiveness", 10], ["Большое спасибо.", "Bolshoye spasibo.", "Thank you very much.", 2], ["Пожалуйста.", "Pozhaluysta.", "Please / You're welcome.", 2]]], ["Goodbyes", [["Увидимся.", "Uvidimsya.", "See you.", 10], ["Пока.", "Poka.", "Bye. See you later.", 2], ["До свидания.", "Do svidaniya.", "Till (the next) meeting.", 2], ["Спокойной ночи.", "Spokoinoy nochi.", "Good night.", 10]]]];
const EX=[],BL=[];BLOCKS.forEach((b,k)=>b[1].forEach(e=>{EX.push(e);BL.push(k)}));
const RATE=.8,GAP=700,BEEP_GAP=900;

const ss=window.speechSynthesis;
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const $=id=>document.getElementById(id),list=$('list'),playBtn=$('play'),note=$('note');
let run=0,playing=false,cur=-1,rep=0,ac=null,lock=null,timers=[];

const PLAY='<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>';
list.innerHTML=EX.map((e,i)=>(BL[i]!==BL[i-1]?'<li class="h"><button type="button" data-b="'+BL[i]+'">'+BLOCKS[BL[i]][0]+PLAY+'</button></li>':'')+'<li id="r'+i+'"><button type="button" data-i="'+i+'"><span class="t"><b>'+e[1]+'</b><span>'+e[2]+'</span></span><span class="n">×'+e[3]+'</span></button></li>').join('');
const row=i=>document.getElementById('r'+i);
function badge(i,txt){row(i).querySelector('.n').textContent=txt}
function mark(i,r){
  if(cur>=0&&cur!==i){row(cur).classList.remove('on');badge(cur,'×'+EX[cur][3])}
  cur=i;if(i<0)return;
  row(i).classList.add('on');badge(i,r?r+'/'+EX[i][3]:'×'+EX[i][3]);
  row(i).scrollIntoView({block:'nearest',behavior:'smooth'});
}
function setPlay(on){playing=on;playBtn.innerHTML=on?'<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>Stop':'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>Play all'}
function say(msg){note.textContent=msg;note.style.display=msg?'block':'none'}
setPlay(false);

// Voices load asynchronously; warm them up so they exist by the first tap.
let voices=[];function loadV(){try{voices=ss?ss.getVoices():[]}catch(e){}}
loadV();if(ss)ss.onvoiceschanged=loadV;
function voice(){
  loadV();
  const ru=voices.filter(v=>/^ru/i.test(v.lang)),mil=ru.filter(v=>/milena/i.test(v.name));
  const m=mil.find(v=>!/enhanced|premium/i.test(v.name))||mil[0];
  if(IOS){
    if(m)return m;
    if(!voices.length)return null;           // list not populated yet: iOS's default ru-RU voice is Milena
    return false;                            // voices known, Milena missing
  }
  return m||ru[0]||null;
}

function clearT(){timers.forEach(clearTimeout);timers=[]}
function later(f,ms){timers.push(setTimeout(f,ms))}

function speak(text,id,done){
  const v=voice();
  if(v===false){say('Milena voice not found. Add it in Settings › Accessibility › Spoken Content › Voices › Russian.');stop();return}
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ru-RU';u.rate=RATE;if(v)u.voice=v;
  let fin=false;const end=()=>{if(fin||id!==run)return;fin=true;done&&done()};
  u.onend=end;u.onerror=end;
  window._u=u;                               // keep a reference so Safari doesn't garbage-collect it mid-speech
  ss.speak(u);
  // Watchdog: iOS sometimes drops onend. Advance once speech has really stopped.
  const est=1500+text.length*110/RATE;
  const dog=()=>{if(fin||id!==run)return;if(ss.speaking)later(dog,800);else end()};
  later(dog,est);
}

function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}  // let the beep sound with the silent switch on
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ac=ac||new AC();if(ac.state!=='running')ac.resume();
    const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);
  }catch(e){}
}
function beep(n){n=n||1;for(let k=0;k<n;k++)tone(k*.22)}
function tone(dt){
  try{
    if(!ac)return;if(ac.state!=='running')ac.resume();
    const t=ac.currentTime+.03+dt,o=ac.createOscillator(),g=ac.createGain();
    o.type='sine';o.frequency.value=880;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.16);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.18);
  }catch(e){}
}

async function wake(on){
  try{if(on){if('wakeLock' in navigator)lock=await navigator.wakeLock.request('screen')}else if(lock){lock.release();lock=null}}catch(e){}
}

function stop(){run++;clearT();try{ss.cancel()}catch(e){}setPlay(false);mark(-1);wake(false)}

function play(from,to){                     // plays expressions from..to-1: one beep between expressions, two between blocks
  const id=++run;clearT();say('');
  if(!ss){say('Speech is not available in this browser.');return}
  if(ss.speaking||ss.pending)ss.cancel();
  unlockAudio();setPlay(true);wake(true);
  const step=(i,r)=>{
    if(id!==run)return;
    if(i>=to){stop();return}
    mark(i,r);
    speak(EX[i][0],id,()=>{
      if(r<EX[i][3])later(()=>step(i,r+1),GAP);
      else if(i+1<to){later(()=>{if(id!==run)return;beep(BL[i+1]!==BL[i]?2:1);later(()=>step(i+1,1),BEEP_GAP)},GAP)}
      else stop();
    });
  };
  step(from,1);                              // first speak() runs synchronously inside the tap, which iOS requires
}

playBtn.addEventListener('click',()=>playing?stop():play(0,EX.length));
list.addEventListener('click',e=>{
  const h=e.target.closest('button[data-b]');
  if(h){const k=+h.dataset.b;if(playing)stop();play(BL.indexOf(k),BL.lastIndexOf(k)+1);return}
  const b=e.target.closest('button[data-i]');if(!b)return;
  if(!ss){say('Speech is not available in this browser.');return}
  const i=+b.dataset.i;if(playing)stop();else{run++;clearT();ss.cancel()}
  say('');const id=run;mark(i,0);speak(EX[i][0],id,()=>{if(id===run)mark(-1)});
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&playing)wake(true)});
</script>
</body></html>
