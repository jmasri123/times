<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Russian</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Russian">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#faf8f4;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--bd:#e4e0d8;--ac:#b3261e;--acs:#fbe9e7;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--fg:#f1efe9;--mut:#a09d94;--card:#1f1f1c;--bd:#33332e;--ac:#ef6f63;--acs:#3a1f1c}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.3 system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 12px)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px}
h1{font-size:22px;margin:0}
#play{display:flex;align-items:center;gap:6px;font:600 16px system-ui,-apple-system,sans-serif;color:#fff;background:var(--ac);border:0;border-radius:99px;padding:9px 16px 9px 13px}
#play svg{width:16px;height:16px;fill:currentColor}
ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
li.x{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:0 6px 0 0}
li.on{border-color:var(--ac);background:var(--acs)}
.t{flex:1;min-width:0;text-align:left;padding:10px 4px 10px 12px}
.t b{display:block;font-size:16px}
.t span{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.pz{display:none;flex:none;width:34px;height:34px;border-radius:99px;background:var(--ac);color:#fff}
.pz svg{width:14px;height:14px;fill:currentColor;display:block;margin:auto}
body.pl li.on .pz{display:block}
.st{flex:none;display:flex;align-items:center;border:1px solid var(--bd);border-radius:99px}
.st button{width:30px;height:32px;font:500 18px system-ui,-apple-system,sans-serif;color:var(--mut)}
.n{min-width:34px;text-align:center;font:600 13px ui-monospace,SFMono-Regular,monospace;color:var(--mut)}
li.on .st{border-color:var(--ac)}li.on .n{color:var(--ac)}
li.h{display:flex;align-items:center;gap:2px;padding:26px 0 0}
li.h:first-child{padding-top:0}
li.h button{display:flex;align-items:center;gap:6px;padding:6px 4px;font:700 12px system-ui,-apple-system,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ac)}
li.h button svg{width:10px;height:10px;fill:currentColor}
li.h .cv{fill:none!important;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}li.h.c .cv{transform:rotate(-90deg)}
li.h [data-b]{width:24px;height:24px;margin-left:4px;padding:0;justify-content:center;border-radius:99px;background:var(--ac);color:#fff}
li.h [data-b] svg{width:9px;height:9px;margin-left:1px}
li.x.c:not(.on){display:none}
li.x.c:not(.on)+li.h{padding-top:8px}
#note{display:none;font-size:13px;color:var(--ac);margin:10px 2px 0}
</style></head><body><main>
<header><h1>Russian</h1><button id="play" type="button"></button></header>
<ol id="list"></ol>
<p id="note" role="status"></p>
</main>
<script>
// Blocks of [Russian (spoken), transliteration, English, repetitions]. One beep after each expression, two between blocks.
const BLOCKS=[["Greetings", [["Доброе утро.", "Dobroe utro.", "Good morning.", 10], ["Добрый день.", "Dobriy den'.", "Good afternoon.", 10], ["Добрый вечер.", "Dobriy vecher.", "Good evening.", 10], ["Привет, как дела?", "Privet, kak dela?", "Hi, how are you?", 2], ["Хорошо, а у тебя?", "Khorosho, a u tebya?", "Good, and you?", 2], ["Нормально.", "Normalno.", "Okay / Regular.", 2]]], ["Introductions", [["Здравствуйте. Приятно познакомиться.", "Zdravstvuyte. Priyatno poznakomitsya.", "Hello. Nice to meet you.", 2], ["Мне тоже приятно познакомиться.", "Mne tozhe priyatno poznakomitsya.", "Nice to meet you too.", 2], ["Меня зовут Джафар.", "Menya zovut Jaafar", "My name is Jaafar", 2], ["Вы откуда?", "Vy otkuda?", "Where are you from?", 10], ["Я из Марокко, но живу в Америке.", "Ya iz Marokko, no zhivu v Amerike.", "I'm from Morocco, but I live in America.", 10]]], ["Getting by", [["Извините, вы говорите по-английски?", "Izvinite, Vy govorite po-angliyski?", "Excuse me, Do you speak English?", 10], ["Я немного говорю по-русски.", "Ya nemnogo govoryu po-russki.", "I speak a little Russian.", 10], ["Прошу прощения.", "Proshu proshcheniya.", "I ask for forgiveness", 10], ["Простите.", "Prostite.", "Forgive me. (formal)", 10], ["Большое спасибо.", "Bolshoye spasibo.", "Thank you very much.", 2], ["Пожалуйста.", "Pozhaluysta.", "Please / You're welcome.", 2]]], ["Goodbyes", [["До свидания.", "Do svidaniya.", "Till (the next) meeting.", 2], ["Увидимся.", "Uvidimsya.", "See you.", 10], ["Пока.", "Poka.", "Bye. See you later.", 2], ["Спокойной ночи.", "Spokoinoy nochi.", "Good night.", 10]]], ["Pronouns", [["Я.", "Ya", "I", 2], ["Ты.", "Ty", "You (informal)", 2], ["Вы.", "Vy", "You (formal / plural)", 2], ["Мы.", "My", "We", 2], ["Он.", "On", "He", 2], ["Она.", "Ona", "She", 2]]]];
const EX=[],BL=[];BLOCKS.forEach((b,k)=>b[1].forEach(e=>{EX.push(e);BL.push(k)}));
const RATE=.8,GAP=700,BEEP_GAP=900;

const ss=window.speechSynthesis;
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const $=id=>document.getElementById(id),list=$('list'),playBtn=$('play'),note=$('note');
let run=0,playing=false,cur=-1,rep=0,ac=null,lock=null,timers=[];

// Rep counts the user set with −/+ are kept on this device, keyed by the Russian text.
let saved={};try{saved=JSON.parse(localStorage.getItem('ru-reps')||'{}')}catch(e){}
EX.forEach(e=>{const n=saved[e[0]];if(n>=1&&n<=99)e[3]=n});
function saveReps(){try{const o={};EX.forEach(e=>o[e[0]]=e[3]);localStorage.setItem('ru-reps',JSON.stringify(o))}catch(e){}}

const PLAY='<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>';
list.innerHTML=EX.map((e,i)=>(BL[i]!==BL[i-1]?'<li class="h" id="h'+BL[i]+'"><button type="button" data-c="'+BL[i]+'"><svg class="cv" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg>'+BLOCKS[BL[i]][0]+'</button><button type="button" data-b="'+BL[i]+'" aria-label="Play '+BLOCKS[BL[i]][0]+'">'+PLAY+'</button></li>':'')+
 '<li class="x" data-g="'+BL[i]+'" id="r'+i+'"><button type="button" class="t" data-i="'+i+'"><b>'+e[1]+'</b><span>'+e[2]+'</span></button>'+
 '<button type="button" class="pz" data-p="'+i+'" aria-label="Pause">'+PAUSE+'</button>'+
 '<span class="st"><button type="button" data-d="-1" data-k="'+i+'" aria-label="Fewer">−</button><span class="n"></span><button type="button" data-d="1" data-k="'+i+'" aria-label="More">+</button></span></li>').join('');
const row=i=>document.getElementById('r'+i);
let curR=0;
function badge(i){row(i).querySelector('.n').textContent=(i===cur&&curR?curR+'/':'×')+EX[i][3]}
function mark(i,r){
  const prev=cur;cur=i;curR=r||0;
  if(prev>=0&&prev!==i){row(prev).classList.remove('on');badge(prev)}
  if(i<0)return;
  row(i).classList.add('on');badge(i);pzIcon();
  if(prev!==i)row(i).scrollIntoView({block:'nearest',behavior:'smooth'});
}
EX.forEach((e,i)=>badge(i));
// Collapsed groups are kept on this device. A collapsed group still shows the expression being played.
let shut={};try{shut=JSON.parse(localStorage.getItem('ru-shut')||'{}')}catch(e){}
function setShut(k,on){shut[k]=on;document.getElementById('h'+k).classList.toggle('c',on);document.querySelectorAll('li.x[data-g="'+k+'"]').forEach(r=>r.classList.toggle('c',on));try{localStorage.setItem('ru-shut',JSON.stringify(shut))}catch(e){}}
BLOCKS.forEach((b,k)=>{if(shut[k])setShut(k,true)});
function setPlay(on){playing=on;document.body.classList.toggle('pl',on);playBtn.innerHTML=on?'<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>Stop':'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>Play all'}
function say(msg){note.textContent=msg;note.style.display=msg?'block':'none'}
setPlay(false);

// Voices load asynchronously; warm them up so they exist by the first tap.
let voices=[];function loadV(){try{voices=ss?ss.getVoices():[]}catch(e){}}
loadV();if(ss)ss.onvoiceschanged=loadV;
function voice(){
  loadV();
  const ru=voices.filter(v=>/^ru/i.test(v.lang)),mil=ru.filter(v=>/milena/i.test(v.name));
  const m=mil.find(v=>!/enhanced|premium/i.test(v.name))||mil[0];
  if(IOS){
    if(m)return m;
    if(!voices.length)return null;           // list not populated yet: iOS's default ru-RU voice is Milena
    return false;                            // voices known, Milena missing
  }
  return m||ru[0]||null;
}

function clearT(){timers.forEach(clearTimeout);timers=[]}
function later(f,ms){timers.push(setTimeout(f,ms))}

function speak(text,id,done){
  const v=voice();
  if(v===false){say('Milena voice not found. Add it in Settings › Accessibility › Spoken Content › Voices › Russian.');stop();return}
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ru-RU';u.rate=RATE;if(v)u.voice=v;
  let fin=false;const end=()=>{if(fin||id!==run)return;fin=true;done&&done()};
  u.onend=end;u.onerror=end;
  window._u=u;                               // keep a reference so Safari doesn't garbage-collect it mid-speech
  ss.speak(u);
  // Watchdog: iOS sometimes drops onend. Advance once speech has really stopped.
  const est=1500+text.length*110/RATE;
  const dog=()=>{if(fin||id!==run)return;if(ss.speaking)later(dog,800);else end()};
  later(dog,est);
}

// Beeps are short WAV clips played through an <audio> element, which iPhone handles more reliably
// than Web Audio between speech utterances (Web Audio is only the fallback).
function wav(starts,len){
  const sr=22050,n=Math.round(sr*len),buf=new ArrayBuffer(44+n*2),d=new DataView(buf);
  const w=(o,t)=>{for(let k=0;k<t.length;k++)d.setUint8(o+k,t.charCodeAt(k))};
  w(0,'RIFF');d.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);
  d.setUint32(24,sr,true);d.setUint32(28,sr*2,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*2,true);
  const L=.18;
  for(let k=0;k<n;k++){const t=k/sr;let v=0;
    for(const s0 of starts){const x=t-s0;if(x>=0&&x<L)v+=Math.sin(2*Math.PI*880*x)*Math.min(1,x/.01,(L-x)/.04)}
    d.setInt16(44+k*2,Math.max(-1,Math.min(1,v*.6))*32767,true)}
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
const SND={0:wav([],.05),1:wav([0],.3),2:wav([0,.25],.5)};
let au=null;
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}  // let beeps sound with the silent switch on
  try{au=au||new Audio();au.preload='auto';au.src=SND[0];const p=au.play();if(p)p.catch(()=>{})}catch(e){}  // unlock inside the tap
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ac=ac||new AC();if(ac.state!=='running')ac.resume();
    const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);
  }catch(e){}
}
function beep(n){
  n=n>1?2:1;
  try{au.src=SND[n];const p=au.play();if(p&&p.catch)p.catch(()=>webBeep(n));return}catch(e){}
  webBeep(n);
}
async function webBeep(n){
  try{
    if(!ac)return;if(ac.state!=='running')await ac.resume();
    for(let k=0;k<n;k++){
      const t=ac.currentTime+.05+k*.25,o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=880;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2);
    }
  }catch(e){}
}

async function wake(on){
  try{if(on){if('wakeLock' in navigator)lock=await navigator.wakeLock.request('screen')}else if(lock){lock.release();lock=null}}catch(e){}
}

let paused=null,span=null;                   // paused: {i,r} to resume from; span: [from,to] being played
function pzIcon(){if(cur>=0){const p=row(cur).querySelector('.pz');p.innerHTML=paused?PLAY:PAUSE;p.setAttribute('aria-label',paused?'Resume':'Pause')}}
function stop(){run++;clearT();try{ss.cancel()}catch(e){}paused=null;span=null;setPlay(false);mark(-1);wake(false)}
function pause(){if(!playing||paused)return;run++;clearT();try{ss.cancel()}catch(e){}paused={i:cur,r:curR};pzIcon();wake(false)}

function play(from,to,startRep){             // plays expressions from..to-1: one beep between expressions, two between blocks
  const id=++run;clearT();say('');paused=null;span=[from,to];
  if(!ss){say('Speech is not available in this browser.');return}
  if(ss.speaking||ss.pending)ss.cancel();
  unlockAudio();setPlay(true);wake(true);
  const step=(i,r)=>{
    if(id!==run)return;
    if(i>=to){stop();return}
    mark(i,r);
    speak(EX[i][0],id,()=>{
      if(r<EX[i][3])later(()=>step(i,r+1),GAP);
      else if(i+1<to){later(()=>{if(id!==run)return;beep(BL[i+1]!==BL[i]?2:1);later(()=>step(i+1,1),BEEP_GAP)},GAP)}
      else stop();
    });
  };
  step(from,startRep||1);                    // first speak() runs synchronously inside the tap, which iOS requires
}

playBtn.addEventListener('click',()=>playing?stop():play(0,EX.length));
list.addEventListener('click',e=>{
  const d=e.target.closest('button[data-d]');
  if(d){const i=+d.dataset.k;EX[i][3]=Math.max(1,Math.min(99,EX[i][3]+ +d.dataset.d));saveReps();badge(i);return}
  const p=e.target.closest('button[data-p]');
  if(p){if(paused){const q=paused;play(q.i,span[1],Math.min(q.r||1,EX[q.i][3]))}else if(playing)pause();return}
  const c=e.target.closest('button[data-c]');
  if(c){const k=+c.dataset.c;setShut(k,!shut[k]);return}
  const h=e.target.closest('button[data-b]');
  if(h){const k=+h.dataset.b;if(playing)stop();play(BL.indexOf(k),BL.lastIndexOf(k)+1);return}
  const b=e.target.closest('button[data-i]');if(!b)return;
  if(!ss){say('Speech is not available in this browser.');return}
  const i=+b.dataset.i;if(playing)stop();else{run++;clearT();ss.cancel()}
  say('');const id=run;mark(i,0);speak(EX[i][0],id,()=>{if(id===run)mark(-1)});
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&playing&&!paused)wake(true)});
</script>
</body></html>
